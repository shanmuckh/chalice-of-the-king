# Development setup - only Redis. Run backend/frontend with `npm run dev`.
#   docker compose -f docker-compose.dev.yml up -d
services:
  redis:
    image: redis:7-alpine
    container_name: chalice-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  redis-dev-data:
